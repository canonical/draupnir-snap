name: draupnir
summary: Draupnir snap
description: A moderation tool for Matrix
version: 3.2.0
base: core22
license: Apache-2.0
confinement: strict
architectures:
  - build-on: [amd64]
    build-for: [amd64]
apps:
  draupnir:
    command: "bin/node $SNAP/draupnir/apps/draupnir/dist/index.js"
    plugs:
      - network
parts:
    node:
        plugin: dump
        source: https://nodejs.org/dist/v24.22.3/node-v24.22.3-linux-x64.tar.xz
        stage:
            - bin
            - include
            - lib
    install-draupnir:
        after: [node]
        plugin: nil
        source: https://github.com/the-draupnir-project/Draupnir.git
        source-tag: v3.2.0
        source-type: git
        override-build: |
            npm ci
            npm run build
            npm prune --omit=dev
            mkdir -p $CRAFT_PRIME/draupnir
            mv apps packages node_modules draupnir-entrypoint.sh $CRAFT_PRIME/draupnir/
            echo $SNAPCRAFT_PROJECT_VERSION > $CRAFT_PRIME/draupnir/apps/draupnir/version.txt

